# Эсциталопрам — по инструкции Ципралекс (РУ ЛП-№(011897)-(РГ-RU) от 29.09.2025).
# В инструкции НЕТ показания «ГТР»: при F41.1 применение — вне инструкции (решение врача),
# хотя КР 457_3 относит эсциталопрам к первой линии.
id: escitalopram
trade_name: Эсциталопрам (Ципралекс)
inn: эсциталопрам
atc: N06AB10
pharm_group: Антидепрессант, СИОЗС
classes: [ssri]
additional_monitoring: false
verified: false   # по копии ИМП (Видаль); сверить с ГРЛС
registration: { number: "ЛП-№(011897)-(РГ-RU)", date: "2025-09-29", holder: "H. Lundbeck A/S (Дания)" }
sources:
  instruction: { title: "Инструкция по медицинскому применению ЛП Ципралекс, ЛП-№(011897)-(РГ-RU)", url: "https://www.vidal.ru/drugs/cipralex__3385" }

indications:
  - id: depression
    title: Депрессия
    icd10: [F32, F33]
    regimen: { dose_mg: 10, times_per_day: 1, daily_mg: 10, max_daily_mg: 20, timing: "1 раз в сутки", duration: "несколько месяцев; отмена постепенно за 1–2 недели" }
  - id: panic
    title: Панические расстройства (в т. ч. с агорафобией)
    icd10: [F41.0, F40.0]
    regimen: { dose_mg: 5, times_per_day: 1, daily_mg: 5, max_daily_mg: 20, timing: "1 раз в сутки, низкая начальная доза", duration: "несколько месяцев" }

contraindications:
  - id: maoi
    title: Одновременный приём ингибиторов МАО (и 2 недели после отмены необратимых иМАО)
    when: { or: [ { in: ["maoi", { var: meds.classes }] }, { "<": [{ var: meds.maoi_stopped_days_ago }, 14] } ] }
  - { id: age, title: "Детский и подростковый возраст до 15 лет", when: { "<": [{ var: patient.age }, 15] } }
  - { id: pregnancy, title: "Беременность", when: { "==": [{ var: patient.pregnant }, true] } }
  - { id: lactation, title: "Период грудного вскармливания", when: { "==": [{ var: patient.lactating }, true] } }

cautions:
  - { id: elderly, title: "Пожилой возраст (> 65 лет): начальная доза 5 мг, максимум 10 мг/сут", when: { ">=": [{ var: patient.age }, 65] } }
  - { id: hepatic, title: "Печёночная недостаточность: первые 2 недели 5 мг/сут, затем до 10 мг/сут", when: { in: [{ var: patient.child_pugh }, ["A", "B", "C"]] } }
  - { id: renal, title: "Почечная недостаточность (КК < 30 мл/мин)", when: { "<": [{ var: patient.egfr }, 30] } }
  - { id: bipolar, title: "Гипомания, мания", when: { some_in: [["bipolar", "mania_history"], { var: patient.conditions }] } }
  - { id: epilepsy, title: "Фармакологически неконтролируемая эпилепсия", when: { in: ["epilepsy", { var: patient.conditions }] } }
  - { id: diabetes, title: "Сахарный диабет", when: { in: ["diabetes", { var: patient.conditions }] } }

interactions:
  - { classes: [maoi], severity: contraindicated, text: "Противопоказано; эсциталопрам — не ранее 2 недель после отмены необратимых иМАО" }
  - { classes: [ssri, snri, tca, triptan, opioid, lithium, st_johns_wort, tryptophan], severity: major, text: "Риск серотонинового синдрома" }
  - { classes: [anticoagulant, antiplatelet, nsaid], severity: moderate, text: "Склонность к кровотечениям — с осторожностью" }
  - { classes: [alcohol], severity: moderate, text: "С осторожностью при одновременном приёме этанола" }

adverse_reactions:
  common: [тошнота, головная боль, бессонница, сонливость, сексуальная дисфункция, потливость]
  uncommon: [гипонатриемия, кровотечения]

monitoring:
  scales:
    - { scale: PHQ9, every_days: 14 }
    - { scale: GAD7, every_days: 14 }
  response_check_week: 4
