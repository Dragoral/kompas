# Агомелатин — по инструкции Вальдоксан (РУ ЛП-№(000528)-(РГ-RU)).
# Показание — только большое депрессивное расстройство; при ГТР — вне инструкции.
id: agomelatine
trade_name: Агомелатин (Вальдоксан)
inn: агомелатин
atc: N06AX22
pharm_group: Антидепрессант, агонист мелатониновых рецепторов
classes: [melatonergic]
additional_monitoring: false
verified: false   # по копии ИМП (Видаль); сверить с ГРЛС
registration: { number: "ЛП-№(000528)-(РГ-RU)", date: "2022-01-25", holder: "Les Laboratoires Servier (Франция)" }
sources:
  instruction: { title: "Инструкция по медицинскому применению ЛП Вальдоксан, ЛП-№(000528)-(РГ-RU)", url: "https://www.vidal.ru/drugs/valdoxan" }

indications:
  - id: depression
    title: Большое депрессивное расстройство у взрослых
    icd10: [F32, F33]
    regimen: { dose_mg: 25, times_per_day: 1, daily_mg: 25, max_daily_mg: 50, timing: "1 раз в сутки вечером; через 2 недели без эффекта — 50 мг", duration: "не менее 6 месяцев после исчезновения симптомов" }

contraindications:
  - { id: hepatic, title: "Печёночная недостаточность, цирроз, активное заболевание печени", when: { or: [{ in: [{ var: patient.child_pugh }, ["A", "B", "C"]] }, { in: ["liver_disease", { var: patient.conditions }] }] } }
  - { id: cyp1a2, title: "Одновременный приём сильных ингибиторов CYP1A2 (флувоксамин, ципрофлоксацин)", when: { in: ["cyp1a2_strong_inhibitor", { var: meds.classes }] } }
  - { id: age, title: "Возраст до 18 лет", when: { "<": [{ var: patient.age }, 18] } }

cautions:
  - { id: liver_monitoring, title: "Контроль функции печени: до начала, через 6, 12 и 24 недели; отмена при АЛТ/АСТ более 3 ВГН", when: { "==": [1, 1] } }
  - { id: elderly, title: "65 лет и старше — эффективность не установлена, с осторожностью", when: { ">=": [{ var: patient.age }, 65] } }
  - { id: renal, title: "Почечная недостаточность средней и тяжёлой степени", when: { "<": [{ var: patient.egfr }, 60] } }
  - { id: bipolar, title: "Мания — отменить при появлении", when: { some_in: [["bipolar", "mania_history"], { var: patient.conditions }] } }
  - { id: pregnancy, title: "Беременность — данных нет, только при тщательной оценке пользы и риска", when: { "==": [{ var: patient.pregnant }, true] } }
  - { id: lactation, title: "Лактация — прекратить грудное вскармливание", when: { "==": [{ var: patient.lactating }, true] } }

interactions:
  - { classes: [cyp1a2_strong_inhibitor], severity: contraindicated, text: "Сильные ингибиторы CYP1A2 противопоказаны" }
  - { classes: [alcohol], severity: moderate, text: "Совместный приём с этанолом не рекомендуется" }

adverse_reactions:
  common: [головная боль, головокружение, сонливость, бессонница, тошнота, повышение трансаминаз]
  uncommon: [тревога, парестезии, кожный зуд]

monitoring:
  scales:
    - { scale: PHQ9, every_days: 14 }
  response_check_week: 2
