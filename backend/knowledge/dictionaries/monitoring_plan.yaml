# Базовый план наблюдения: назначается каждому пациенту при включении дистанционного
# наблюдения (после очного приёма). Шкалы из плана мониторинга препарата добавляются,
# только если такой шкалы ещё нет в плане.
# По рекомендации врачей команды: ежедневно — ИТТ, раз в 2 недели — GAD-7 и PHQ-9.
# При относительной стабилизации плановые приёмы — раз в месяц (КР); регулярный
# самоконтроль позволяет врачу обоснованно увеличивать интервал между приёмами.
verified: false
scales:
  - { scale: ITT,  every_days: 1 }
  - { scale: GAD7, every_days: 14 }
  - { scale: PHQ9, every_days: 14 }
