# Политика реагирования на критические алерты (настраивается клиникой; изменения —
# через клиническое одобрение, как и остальные справочники).
# Лечащий врач получает внешнее уведомление (SMS) только в рабочее время. Вне его —
# дежурная служба (если есть), доверенное лицо пациента (если дано согласие) и
# кризисный экран самого пациента. Лечащий врач видит алерт первым при следующем входе.
verified: false   # согласовать с врачами команды
timezone_offset_hours: 3          # МСК
working_hours: { days: [1, 2, 3, 4, 5], start: "09:00", end: "18:00" }   # по умолчанию для врачей
duty_service: true                # есть ли круглосуточная дежурная служба (врач с флагом «дежурный»)
escalate_after_min: 15            # без подтверждения — дежурному (в рабочее время)
trusted_contact:
  # при каких алертах сообщать доверенному лицу (если пациент дал согласие)
  rules: [suicide_cssrs_high, suicide_phq9, suicide_text]
  any_time: true                  # и в рабочее, и в нерабочее время
  sms_template: "{patient_first_name} просит сообщить вам: сейчас ему/ей может понадобиться ваша поддержка. Пожалуйста, свяжитесь с ним/ней. При угрозе жизни звоните 112."
doctor_sms_template: "Компас: срочное уведомление по пациенту {patient_code}. Откройте кабинет врача."
duty_sms_template: "Компас: ДЕЖУРНОМУ — срочное уведомление по пациенту {patient_code} (лечащий врач вне рабочего времени)."
