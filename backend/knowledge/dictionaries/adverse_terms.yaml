# Распознавание нежелательных реакций в словах пациента.
# term — стандартный термин (как в разделе «Побочное действие» инструкции);
# aliases — другие названия того же явления в инструкциях (для сравнения со справочником препаратов);
# patterns — разговорные формулировки (регулярные выражения по тексту в нижнем регистре, «ё» → «е»).
# Опечатки дополнительно распознаются нечётким сравнением со словами термина.
# Пациенту список не показывается (эффект ноцебо) — только врачу в результате анализа.
verified: false   # стартовый набор; дополняется и проверяется врачами команды

terms:
  - term: головокружение
    patterns: ['головокруж\w*', 'голов\w* круж\w*', 'круж\w* голов\w*', 'кружится', 'шатает', 'шатаюсь', 'ведет в сторону', 'пол уходит']
  - term: головная боль
    patterns: ['головн\w* бол\w*', 'бол\w* голов\w*', 'голов\w* бол\w*', 'раскалыва\w* голов\w*', 'мигрен\w*']
  - term: сонливость
    patterns: ['сонлив\w*', 'хочется спать', 'хочу спать', 'клонит в сон', 'засыпаю днем', 'все время сплю', 'вялост\w*']
  - term: бессонница
    patterns: ['бессонн\w*', 'не могу уснуть', 'не могу заснуть', 'плохо засыпаю', 'не сплю', 'не спится', 'просыпаюсь ночью', 'просыпаюсь рано']
  - term: ухудшение качества сна
    patterns: ['плохо сплю', 'сон плохой', 'сон беспокойный', 'кошмар\w*', 'тревожн\w* сон\w*']
  - term: астения
    aliases: [слабость]
    patterns: ['слабост\w*', 'астени\w*', 'нет сил', 'упадок сил', 'быстро устаю', 'утомля\w*', 'усталост\w*']
  - term: парестезии
    patterns: ['парестез\w*', 'покалыва\w*', 'мурашк\w*', 'онемен\w*', 'немеют', 'немеет']
  - term: тревога
    aliases: [усиление тревоги]
    patterns: ['тревог\w* (?:сильнее|больше|усилил\w*)', 'усилил\w* тревог\w*', 'беспокойств\w* (?:сильнее|больше)', 'стал\w* тревожн\w*', 'паник\w*']
  - term: нарушение внимания
    patterns: ['не могу сосредоточ\w*', 'трудно сосредоточ\w*', 'рассеян\w*', 'не могу сконцентрир\w*', 'внимани\w* (?:хуже|рассеян\w*|ухудшил\w*)']
  - term: снижение аппетита
    patterns: ['нет аппетита', 'аппетит\w* (?:пропал|снизил\w*|хуже|нет)', '(?:пропал|снизил\w*|ухудшил\w*) аппетит\w*', 'не хочется есть', 'не хочу есть', 'снижен\w* аппетит\w*']
  - term: повышение аппетита
    aliases: [увеличение массы тела]
    patterns: ['аппетит\w* (?:вырос|повысил\w*|больше|усилил\w*)', '(?:вырос|повысил\w*|усилил\w*) аппетит\w*', 'все время хочу есть', 'постоянно хочется есть', 'набрал\w* вес', 'прибавил\w* в весе', 'поправил\w*']
  - term: дисгевзия
    aliases: [изменение вкуса]
    patterns: ['привкус\w*', 'вкус\w* (?:изменил\w*|странн\w*|металл\w*)', 'горечь во рту', 'металлическ\w* вкус\w*']
  - term: тошнота
    patterns: ['тошн\w*', 'тошнит', 'мутит', 'подташнива\w*', 'рвот\w*', 'вырвало', 'рвет']
  - term: боль в верхней части живота
    aliases: [боль в животе]
    patterns: ['бол\w* (?:в )?живот\w*', 'живот\w* бол\w*', 'бол\w* в желудк\w*', 'желуд\w* бол\w*', 'изжог\w*']
  - term: запор
    patterns: ['запор\w*', 'не могу сходить в туалет', 'стул\w* (?:нет|задерж\w*)']
  - term: диарея
    patterns: ['диаре\w*', 'понос\w*', 'жидк\w* стул\w*', 'расстройств\w* (?:кишечник\w*|желудк\w*)']
  - term: гипергидроз
    aliases: [потливость]
    patterns: ['потлив\w*', 'потею', 'потеет', 'пот\w* (?:льет|градом)', 'гипергидроз\w*', 'мокр\w* от пота']
  - term: сухость во рту
    patterns: ['сух\w* во рту', 'сохнет во рту', 'пересыха\w*', 'хочется пить']
  - term: скованность мышц
    patterns: ['скован\w*', 'мышц\w* (?:сводит|напряж\w*|зажат\w*)', 'сводит мышц\w*', 'судорог\w* в ног\w*']
  - term: тризм
    patterns: ['челюст\w* (?:сводит|свело|сжима\w*)', 'сжимаю зуб\w*', 'тризм\w*', 'не могу открыть рот']
  - term: боль в спине
    patterns: ['бол\w* в спин\w*', 'спин\w* бол\w*', 'поясниц\w* бол\w*', 'бол\w* в пояснице']
  - term: сексуальная дисфункция
    patterns: ['либидо', 'влечени\w* (?:снизил\w*|пропал\w*|нет)', 'потенци\w*', 'эрекци\w*', 'оргазм\w*', 'сексуальн\w*']
  - term: кожный зуд
    patterns: ['зуд\w*', 'чешется', 'чесается']
  - term: повышение АД
    patterns: ['давлени\w* (?:повыс\w*|высок\w*|подним\w*|скач\w*)', 'высок\w* давлени\w*', 'гипертони\w*']
  - term: тахикардия
    patterns: ['сердцебиени\w*', 'сердце (?:колотится|стучит|бьется)', 'тахикард\w*', 'пульс\w* (?:частый|высокий|учащ\w*)']
  - term: нечёткость зрения
    patterns: ['(?:плохо|хуже|размыто|нечетко|расплывчато) вижу', 'двоится', 'туман перед глазами', 'размыт\w* зрени\w*', 'зрени\w* (?:хуже|ухудшил\w*|упало)']
  - term: эйфория
    patterns: ['эйфори\w*', 'необычн\w* приподнят\w*', 'слишком весел\w*']
  - term: периферические отёки
    patterns: ['отек\w* ног\w*', 'отекают ног\w*', 'ноги отек\w*', 'отекли ног\w*', 'отекают руки', 'пастозн\w*']
  - term: кровотечения
    patterns: ['кровь из носа', 'носов\w* кровотечени\w*', 'кровоточат десн\w*', 'синяк\w* (?:без причины|появ\w*)', 'легко появляются синяки']
  - term: синдром отмены
    patterns: ['после отмены', 'бросил\w* (?:пить|принимать)', 'перестал\w* (?:пить|принимать)', 'пропустил\w* (?:несколько|пару) (?:дней|приемов)']

# Тревожные признаки: оповещение врачу независимо от препарата и от того, описана ли реакция в инструкции.
# all — все условия в одном сообщении; any — любое из.
red_flags:
  - id: anaphylaxis
    level: critical
    title: Признаки тяжёлой аллергической реакции (отёк лица, затруднённое дыхание)
    any: ['отек\w* (?:лиц\w*|губ\w*|язык\w*|горл\w*|век\w*)', '(?:лицо|губы|язык|горло) (?:отек\w*|опух\w*|распух\w*)', 'трудно дышать', 'тяжело дышать', 'задыха\w*', 'не могу дышать', 'не хватает воздуха']
  - id: serotonin_syndrome
    level: critical
    title: Возможный серотониновый синдром (жар, дрожь или спутанность, мышечные подёргивания)
    all: ['жар\w*|температур\w*|лихорад\w*', 'дрож\w*|тремор\w*|трясет|подергива\w*|спутан\w*|возбужден\w*']
  - id: seizure_syncope
    level: critical
    title: Судороги или потеря сознания
    any: ['судорог\w*\b(?!\s+в\s+(?:ног|икр|мышц))', 'припад\w*', 'потерял\w* сознани\w*', 'обморок\w*', 'отключил\w*']
  - id: chest_pain
    level: critical
    title: Боль в груди
    any: ['бол\w* в груд\w*', 'груд\w* (?:бол\w*|давит|жжет)', 'давит в груди']
  - id: rash
    level: high
    title: Кожная сыпь — возможна аллергическая реакция
    any: ['сып\w*', 'крапивниц\w*', 'волдыр\w*', 'пятна на коже', 'покраснени\w* кож\w*']
  - id: bleeding
    level: high
    title: Признаки кровотечения
    any: ['кровь в моче', 'кровь в кале', 'черный стул', 'рвота с кровью', 'кровотечени\w* (?:не останавлива\w*|сильн\w*)']
  - id: jaundice
    level: high
    title: Возможное поражение печени (желтушность кожи или глаз, тёмная моча)
    any: ['желт\w* (?:кож\w*|глаз\w*|белк\w*)', '(?:кожа|глаза|белки) (?:пожелтел\w*|желт\w*)', 'темн\w* моч\w*']
