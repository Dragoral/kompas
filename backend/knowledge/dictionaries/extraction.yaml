# Словари модуля извлечения (дополняются врачами через одобрение изменений)
description: 'Словари извлечения сведений из историй болезни: формулировки диагнозов (без кода МКБ) и клинических состояний. Регулярные выражения по основе слова; отрицания учитываются автоматически.'
verified: false
diagnoses_text:
- pattern: смешанн\w*\s+тревожн\w*\s+и\s+депрессивн\w*
  icd10: F41.2
  title: Смешанное тревожное и депрессивное расстройство
- pattern: генерализ\w*\s+тревожн\w*\s+расстройств\w*|\bГТР\b
  icd10: F41.1
  title: Генерализованное тревожное расстройство
- pattern: паническ\w*\s+расстройств\w*
  icd10: F41.0
  title: Паническое расстройство
- pattern: рекуррентн\w*\s+депрессивн\w*
  icd10: F33
  title: Рекуррентное депрессивное расстройство
- pattern: тяж[её]л\w*\s+депрессивн\w*\s+эпизод\w*
  icd10: F32.2
  title: Тяжёлый депрессивный эпизод
- pattern: депрессивн\w*\s+эпизод\w*\s+средн\w*|умеренн\w*\s+депрессивн\w*\s+эпизод\w*
  icd10: F32.1
  title: Депрессивный эпизод средней степени
- pattern: л[её]гк\w*\s+депрессивн\w*\s+эпизод\w*|депрессивн\w*\s+эпизод\w*\s+л[её]гк\w*
  icd10: F32.0
  title: Лёгкий депрессивный эпизод
- pattern: депрессивн\w*\s+эпизод\w*
  icd10: F32.9
  title: Депрессивный эпизод
- pattern: посттравматическ\w*\s+стрессов\w*|\bПТСР\b
  icd10: F43.1
  title: Посттравматическое стрессовое расстройство
- pattern: (?:расстройств\w*|нарушени\w*)\s+адаптаци\w*
  icd10: F43.2
  title: Расстройство адаптации
- pattern: остр\w*\s+реакци\w*\s+на\s+стресс
  icd10: F43.0
  title: Острая реакция на стресс
- pattern: гипертоническ\w*\s+болезн\w*|артериальн\w*\s+гипертензи\w*
  icd10: I10
  title: Артериальная гипертензия
- pattern: сахарн\w*\s+диабет\w*\s*(?:2|II|второго)
  icd10: E11
  title: Сахарный диабет 2 типа
- pattern: ишемическ\w*\s+болезн\w*\s+сердца|\bИБС\b
  icd10: I25
  title: Ишемическая болезнь сердца
- pattern: гипотиреоз\w*
  icd10: E03
  title: Гипотиреоз
- pattern: эпилепси\w*
  icd10: G40
  title: Эпилепсия
- pattern: хроническ\w*\s+болезн\w*\s+почек|\bХБП\b
  icd10: N18
  title: Хроническая болезнь почек
conditions:
- pattern: эпилепси\w*|судорожн\w*\s+синдром
  tag: epilepsy
- pattern: органическ\w*\s+(?:поражени\w*|заболевани\w*|расстройств\w*)|черепно-мозгов\w*\s+травм\w*|\bЧМТ\b|инсульт\w*|\bОНМК\b
  tag: organic_brain_disease
- pattern: \bИБС\b|ишемическ\w*\s+болезн\w*|инфаркт\w*|гипертони\w*|гипертензи\w*|аритми\w*|фибрилляци\w*|сердечн\w*\s+недостаточн\w*
  tag: cardiovascular
- pattern: сахарн\w*\s+диабет\w*
  tag: diabetes
- pattern: гипотиреоз\w*|гипертиреоз\w*|тиреоидит\w*|эндокрин\w*\s+заболевани\w*
  tag: endocrine
- pattern: (?:синдром\w*\s+)?зависимост\w*\s+от\s+алкогол\w*|алкогольн\w*\s+зависимост\w*|алкоголизм\w*
  tag: alcohol_dependence
- pattern: зависимост\w*\s+от\s+(?:опиоид|каннабино|психоактивн|ПАВ)\w*|наркотическ\w*\s+зависимост\w*
  tag: substance_dependence
- pattern: биполярн\w*
  tag: bipolar
- pattern: маниакальн\w*\s+эпизод\w*|гипомани\w*
  tag: mania_history
- pattern: галлюцинац\w*|бредов\w*|\bбред\w*|психотическ\w*\s+симптом\w*
  tag: psychotic_symptoms
- pattern: удлинени\w*\s+(?:интервала\s+)?QT
  tag: long_qt
