# Интегративный тест тревожности (ИТТ), самооценка тревожности — для ежедневного мониторинга.
# Текст пунктов и таблица станайнов — по материалам врачей команды. Шкала указана
# в приложениях КР «Генерализованное тревожное расстройство» (457_3).
# Вопрос врачам: инструкция («именно СЕЙЧАС, В ДАННЫЙ МОМЕНТ, СЕГОДНЯ») соответствует
# ситуативной форме (СТ-С); в записке указана личностная (СТ-Л). Для ежедневного
# мониторинга уместна ситуативная — уточнить.
code: ITT
title: ИТТ — интегративный тест тревожности (самооценка, ежедневно)
respondent: patient
period: >-
  Ниже приведены утверждения о вашем эмоциональном состоянии. Отметьте, насколько каждое
  состояние выражено именно сейчас, в данный момент, сегодня.
license: Методика НИПНИ им. В.М. Бехтерева (методические рекомендации); условия использования уточнить у правообладателя
validation:
  - "Бизюк А.П., Вассерман Л.И., Иовлев Б.В. Применение интегративного теста тревожности (ИТТ): новая медицинская технология. СПб.: НИПНИ им. В.М. Бехтерева, 2005"
  - "Клинические рекомендации «Генерализованное тревожное расстройство» (Минздрав России, ID 457_3), приложения"
verified: false
options: &opts
  - { value: 0, label: Совсем нет }
  - { value: 1, label: Слабо выражено }
  - { value: 2, label: Выражено }
  - { value: 3, label: Очень выражено }
items:
  - { n: 1,  text: "Я нахожусь в напряжении", options: *opts }
  - { n: 2,  text: "Я расстроен(а)", options: *opts }
  - { n: 3,  text: "Я тревожусь о будущем", options: *opts }
  - { n: 4,  text: "Я нервничаю", options: *opts }
  - { n: 5,  text: "Я озабочен(а)", options: *opts }
  - { n: 6,  text: "Я возбуждён(а)", options: *opts }
  - { n: 7,  text: "Я ощущаю непонятную угрозу", options: *opts }
  - { n: 8,  text: "Я устаю быстрее обычного", options: *opts }
  - { n: 9,  text: "Я не уверен(а) в себе", options: *opts }
  - { n: 10, text: "Я избегаю любых конфликтов", options: *opts }
  - { n: 11, text: "Я чувствую замешательство", options: *opts }
  - { n: 12, text: "Я ощущаю свою бесполезность", options: *opts }
  - { n: 13, text: "Я спал(а) беспокойно", options: *opts }
  - { n: 14, text: "Я ощущаю себя утомлённым(ой)", options: *opts }
  - { n: 15, text: "Я эмоционально чувствителен(на)", options: *opts }
scoring: { method: sum }
# Сырой балл -> станайн. 1–3 — низкая тревога, 4–6 — средняя, 7–9 — клинически значимо повышенная.
# Общие градации — нормы для мужчин («взрослые и юноши»); для женщин — отдельная группа норм.
bands:
  - { min: 0,  max: 6,  label: "1 станайн — низкая тревога", severity: 0 }
  - { min: 7,  max: 8,  label: "2 станайн — низкая тревога", severity: 0 }
  - { min: 9,  max: 9,  label: "3 станайн — низкая тревога", severity: 0 }
  - { min: 10, max: 11, label: "4 станайн — средняя тревога", severity: 1 }
  - { min: 12, max: 14, label: "5 станайн — средняя тревога", severity: 1 }
  - { min: 15, max: 18, label: "6 станайн — средняя тревога", severity: 1 }
  - { min: 19, max: 22, label: "7 станайн — повышенная тревога", severity: 2 }
  - { min: 23, max: 26, label: "8 станайн — повышенная тревога", severity: 2 }
  - { min: 27, max: 45, label: "9 станайн — повышенная тревога", severity: 3 }
norm_groups:
  - title: Нормы для женщин
    when: { "==": [{ var: patient.sex }, "f"] }
    bands:
      - { min: 0,  max: 6,  label: "1 станайн — низкая тревога", severity: 0 }
      - { min: 7,  max: 8,  label: "2 станайн — низкая тревога", severity: 0 }
      - { min: 9,  max: 10, label: "3 станайн — низкая тревога", severity: 0 }
      - { min: 11, max: 12, label: "4 станайн — средняя тревога", severity: 1 }
      - { min: 13, max: 16, label: "5 станайн — средняя тревога", severity: 1 }
      - { min: 17, max: 21, label: "6 станайн — средняя тревога", severity: 1 }
      - { min: 22, max: 25, label: "7 станайн — повышенная тревога", severity: 2 }
      - { min: 26, max: 30, label: "8 станайн — повышенная тревога", severity: 2 }
      - { min: 31, max: 45, label: "9 станайн — повышенная тревога", severity: 3 }
