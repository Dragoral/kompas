code: PHQ9
title: PHQ-9 — опросник здоровья пациента (депрессия)
respondent: patient
period: За последние 2 недели как часто вас беспокоили следующие проблемы?
license: Свободное использование (Pfizer Inc.), разрешение не требуется
validation:
  - Kroenke K., Spitzer R.L., Williams J.B. The PHQ-9. J Gen Intern Med. 2001;16(9):606–613
  - Русскоязычная версия — phqscreeners.com; психометрика русской версии — исследование на выборке жителей Москвы (Eur Psychiatry, 2024)
verified: false   # текст пунктов сверить с валидированной русской версией
options: &opts
  - { value: 0, label: Ни разу }
  - { value: 1, label: Несколько дней }
  - { value: 2, label: Более половины дней }
  - { value: 3, label: Почти каждый день }
items:
  - { n: 1, text: "Вам было неинтересно или не доставляло удовольствия чем-либо заниматься", options: *opts }
  - { n: 2, text: "У вас было плохое настроение, подавленность или чувство безысходности", options: *opts }
  - { n: 3, text: "Вам было трудно заснуть, у вас был прерывистый сон, или вы слишком много спали", options: *opts }
  - { n: 4, text: "Вы были утомлены, или у вас было мало сил", options: *opts }
  - { n: 5, text: "У вас был плохой аппетит, или вы переедали", options: *opts }
  - { n: 6, text: "Вы плохо о себе думали — считали себя неудачником или были в себе разочарованы, или считали, что подвели свою семью", options: *opts }
  - { n: 7, text: "Вам было трудно сосредоточиться (например, на чтении газеты или просмотре телепередач)", options: *opts }
  - { n: 8, text: "Вы двигались или говорили настолько медленно, что окружающие это замечали? Или, наоборот, вы были настолько суетливы или взбудоражены, что двигались больше обычного", options: *opts }
  - { n: 9, text: "Вас посещали мысли о том, что вам лучше было бы умереть, или о том, чтобы причинить себе какой-нибудь вред", options: *opts, critical: true }
scoring: { method: sum, min: 0, max: 27 }
bands:
  - { min: 0, max: 4, label: Минимальная, severity: 0 }
  - { min: 5, max: 9, label: Лёгкая, severity: 1 }
  - { min: 10, max: 14, label: Умеренная, severity: 2 }
  - { min: 15, max: 19, label: Умеренно тяжёлая, severity: 3 }
  - { min: 20, max: 27, label: Тяжёлая, severity: 4 }
mcid: 5   # клинически значимое изменение (Löwe B. et al., Med Care 2004)
