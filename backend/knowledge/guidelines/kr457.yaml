# Клинические рекомендации «Генерализованное тревожное расстройство» (МЗ РФ).
# Тезисы приведены близко к тексту КР с указанием раздела и уровней
# убедительности (УУР) / достоверности (УДД). Официальный документ (ст. 1259 ГК РФ).
code: KR457
id: "457_3"
title: Генерализованное тревожное расстройство
icd10: [F41.1]
version: 3
published: "2024-09-19"
status: Применяется
npc_approved: true
developer: Российское общество психиатров
url: https://cr.minzdrav.gov.ru/preview-cr/457_3
age: взрослые
verified: true   # тезисы сверены с текстом КР (рубрикатор, API apicr.minzdrav.gov.ru, 17.10.2026)

theses:
  complex_therapy:
    section: "3.1"
    text: "Всем пациентам с ГТР с целью купирования симптоматики рекомендуется применение психофармакотерапии и/или психотерапии"
    uur: A
    udd: 1
  first_line:
    section: "3.2"
    text: "Начинать терапию с СИОЗС (пароксетин 20–40 мг/сут, эсциталопрам 10–20 мг/сут, #сертралин 50–200 мг/сут), либо СИОЗСН (#венлафаксин 75–225 мг/сут, дулоксетин 30–120 мг/сут), либо агомелатина (25–50 мг/сут); первый курс — монотерапия 4–6 недель"
    uur: A
    udd: 1
  warn_side_effects:
    section: "3.2"
    text: "Предупредить пациента о возможных побочных эффектах в начале приёма антидепрессантов; в первые недели наблюдать, оценивая суицидальные риски и возможное усиление тревоги"
    uur: A
    udd: 1
  short_benzo:
    section: "3.2"
    text: "При выраженной тревоге и вегетативных нарушениях на первом этапе — краткосрочно производные бензодиазепина; не назначать при зависимости/риске зависимости от ПАВ и пожилым (риск падений)"
    uur: A
    udd: 1
  check_adherence:
    section: "3.2"
    text: "При недостаточном эффекте сначала удостовериться в должной комплаентности пациента"
    uur: C
    udd: 3
  second_line:
    section: "3.2"
    text: "Вторая линия: повышение дозы антидепрессанта до максимальной, смена на другой препарат первой линии, монотерапия прегабалином (150–600 мг/сут) или более длительное присоединение бензодиазепинов"
    uur: B
    udd: 2
  maritupirdine:
    section: "3.2"
    text: "При рефрактерности к препаратам первых двух линий рекомендуется маритупирдин 40 мг/сут (другие анксиолитики, N05BX)"
    uur: B
    udd: 2
  fabomotizole:
    section: "3.2"
    text: "Для купирования психических и соматических симптомов тревоги рекомендуется фабомотизол 30–60 мг/сут"
    uur: C
    udd: 5
  assessment_schedule:
    section: "3.2"
    text: "Оценка эффективности и переносимости на 7-й, 14-й, 28-й дни психофармакотерапии и далее 1 раз в 4 недели до окончания курса"
    uur: C
    udd: 5
  response_criteria:
    section: "3.2, комментарий"
    text: "Оценка по шкале тревоги Гамильтона (HARS): ответ — снижение общего балла более чем на 50%, ремиссия — менее 7 баллов; при недостаточной эффективности монотерапии через 4–6 недель — смена препарата или комбинированная схема"
    uur: C
    udd: 5
  duration:
    section: "3.2, комментарий"
    text: "Целесообразна длительная терапия — 12 месяцев и более; после стабилизации продолжать в той же дозе ещё 6–12 месяцев; отмена — постепенно"
    uur: B
    udd: 2
  relaxation:
    section: "3.3"
    text: "Всем пациентам с ГТР — релаксационные методы психотерапии, 10–15 сеансов"
    uur: B
    udd: 1
  cbt:
    section: "3.3"
    text: "Всем пациентам с ГТР (кроме пациентов со сниженным интеллектом) — когнитивно-поведенческая психотерапия"
    uur: C
    udd: 5

# Линии психофармакотерапии (Приложение Б3) — по классам/МНН
lines:
  1: { title: Первая линия, inn: [пароксетин, эсциталопрам, сертралин, венлафаксин, дулоксетин, агомелатин], thesis: first_line }
  2: { title: Вторая линия, inn: [прегабалин], strategies: [dose_increase, switch_within_first_line, benzodiazepine_extended], thesis: second_line }
  3: { title: Препараты при рефрактерности к 1-й и 2-й линии, inn: [маритупирдин, имипрамин, гидроксизин, кветиапин, буспирон], thesis: maritupirdine }

# Критерии оценки качества первичной медико-санитарной помощи (F41.1)
quality_criteria:
  - { id: q1, text: "Выполнен первичный приём врача-психиатра/психотерапевта с развёрнутым обследованием, включая оценку суицидального риска", check: suicide_risk_assessed }
  - { id: q4, text: "Назначены антидепрессанты и/или анксиолитики (при показаниях и отсутствии противопоказаний)", check: pharmacotherapy_prescribed }
  - { id: q5, text: "Проведена смена терапии при отсутствии эффекта или непереносимости", check: therapy_changed_if_no_response }
  - { id: q6, text: "Проведена индивидуальная и/или групповая психотерапия", check: psychotherapy }
  - { id: q7, text: "Выполнен повторный приём с оценкой эффективности лечения", check: efficacy_reassessed }
