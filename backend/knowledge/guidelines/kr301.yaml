# Клинические рекомендации «Депрессивный эпизод, Рекуррентное депрессивное расстройство» (МЗ РФ).
code: KR301
id: "301_3"
title: Депрессивный эпизод, Рекуррентное депрессивное расстройство
icd10: [F32, F33]
version: 3
published: "2024-08-26"
status: Применяется
npc_approved: true
developer: Российское общество психиатров
url: https://cr.minzdrav.gov.ru/preview-cr/301_3
age: взрослые
audience: "врачи-психиатры, врачи-психотерапевты, медицинские психологи, врачи общей практики (семейные врачи)"
verified: true

theses:
  suicide_risk:
    section: "2.1"
    text: "Рекомендуется оценка суицидального риска; для оценки тяжести суицидальных намерений целесообразна Колумбийская шкала (C-SSRS). Пациент с суицидальными мыслями, намерениями или планами требует пристального наблюдения; при высоком риске — госпитализация"
    uur: null
    udd: null
    evidence_note: "в тексте КР: «Уровень убедительности рекомендации 4 (уровень достоверности доказательств D)»"
  rating_scales:
    section: "2.1"
    text: "Для оценки тяжести состояния целесообразны шкала Гамильтона для оценки депрессии (HAMD-17) и шкала Монтгомери–Асберг (MADRS)"
    uur: null
    udd: null
    evidence_note: "в тексте КР: «Уровень убедительности рекомендации 4 (уровень достоверности доказательств D)»"
  repeat_visit:
    section: "2.1"
    text: "Всем пациентам с депрессивным эпизодом, получающим терапию, рекомендуется повторный приём врача-психиатра с оценкой эффективности лечения"
    uur: C
    udd: 5
  second_stage:
    section: "3.2"
    text: "При отсутствии динамики или недостаточном эффекте (редукция симптоматики 25–50%) в течение 3–4 недель либо плохой переносимости — переход ко второму курсу (этапу) терапии; предварительно проверить диагноз, дозу и комплаентность"
    uur: null
    udd: null
  doses:
    section: "3.1, табл. 2"
    text: "Рекомендуемые дозы АД: эсциталопрам — стартовая 5–10 мг/сут, диапазон 10–20 мг/сут; сертралин — 25–50 / 50–200 мг/сут; пароксетин — 10–20 / 20–60 мг/сут"
    uur: null
    udd: null

lines:
  1: { title: Первый этап (антидепрессанты), inn: [эсциталопрам, сертралин, пароксетин, флуоксетин, флувоксамин, венлафаксин, дулоксетин, миртазапин, агомелатин, вортиоксетин], thesis: doses }

quality_criteria:
